# Deploys the API and MCP server to Fly.io on every push to main that touches the app's own
# files. Flags and action versions must be verified against current vendor docs before the
# first real run: https://fly.io/docs/flyctl/deploy/ and
# https://github.com/superfly/flyctl-actions

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "fly.toml"
      - "Dockerfile"

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
