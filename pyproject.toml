[project]
name = "petasos"
version = "0.1.0"
description = "A trust gate for AI agents: rule-derived risk tiers, single-use grants, a tamper-evident ledger, and a canary-guarded MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "mcp==2.2.0",
    "pydantic==2.13.5",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.168.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petasos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
