# Builds the demo app, folds it into the static site, and deploys the site to Cloudflare
# Pages when Elias starts a release by hand. Flags and action
# versions must be verified against current vendor docs before the first real run:
# https://developers.cloudflare.com/pages/ and https://github.com/cloudflare/wrangler-action

name: Deploy site

# Release is a separate decision from merge (review finding 8, 2026-09-26): this workflow runs
# only when Elias starts it by hand and names the commit to release. It never runs on push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The exact commit or tag to release (must have a green CI run)"
        required: true

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check whether the demo app exists yet
        id: demo
        run: |
          if [ -f demo/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install demo dependencies
        if: steps.demo.outputs.present == 'true'
        working-directory: demo
        run: npm ci

      - name: Build demo app
        if: steps.demo.outputs.present == 'true'
        working-directory: demo
        run: npm run build

      - name: Copy demo build into the site
        if: steps.demo.outputs.present == 'true'
        run: |
          mkdir -p site/demo
          cp -r demo/dist/. site/demo/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name petasos
